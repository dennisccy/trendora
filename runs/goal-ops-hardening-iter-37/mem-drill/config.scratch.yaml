# Trendora — single source of ALL tunables (NO magic numbers in calculation code).
# Read ONLY via apps/backend/app/config.py :: load_config(). Adding a scoring literal
# in code instead of here is an anti-goal violation.
#
# iter-1 CONSUMES: provider, database, universe (+filters), etfs, themes, buckets.
# iter-2 ALSO CONSUMES: indicators, sectors, regime (weights + vix_threshold + label_edges).
# The scoring / decision_rules / walk_forward sections below remain SCAFFOLDED (real config,
# not code) but are NOT wired/consumed until iter-3+. All values are illustrative defaults to
# be tuned against the walk-forward evidence; do not treat them as final.

# ----------------------------------------------------------------------------------------
# Data provider (DEFAULT = offline committed seed). The default boot/runtime path always reads
# the committed seed; an import LIVE provider is resolved ONLY by the on-demand Data Manager
# fetch path (from the `data_manager.providers` catalog below), never by the boot lifespan — so
# the walk-forward evidence stays reproducible.
provider: seed            # seed | stooq  (the offline boot/runtime provider; NOT an import source)

# ----------------------------------------------------------------------------------------
# iter-3 / iter-21 CONSUMED — Data Manager (J-17 + J-33). Every Data Manager job limit / display
# cap AND the import provider catalog live here (anti-goal: No magic numbers — no job/range literal,
# and NO hardcoded provider list, in app/engine/data_manager.py or app/api/data.py). The Data Manager
# ORCHESTRATES the existing canonical create-once paths (scanner.run_scan +
# forward_testing.backfill_run_forward_returns) — it computes no score/return of its own.
data_manager:
  # J-33 import-source catalog: the selectable, key-aware EOD providers. Each entry declares its key
  # requirement + the ENVIRONMENT-VARIABLE NAME the key is read from (the NAME only — a key VALUE is
  # NEVER written here, to the DB, the run log, or any committed file). Availability is env-detected at
  # request time (a needs_key source is "available" only when its env_var is set). `supports_market_cap`
  # is declared now for the J-35 expand-eligibility gate (consumed in iter-23; default false).
  providers:
    - id: yahoo            # the no-key runbook source, listed first (the default import source)
      label: "Yahoo Finance"
      needs_key: false
      supports_market_cap: true
    - id: tiingo
      label: "Tiingo"
      needs_key: true
      env_var: TIINGO_API_KEY
      supports_market_cap: true
    - id: finnhub
      label: "Finnhub"
      needs_key: true
      env_var: FINNHUB_API_KEY
      supports_market_cap: true
    - id: alpha_vantage
      label: "Alpha Vantage"
      needs_key: true
      env_var: ALPHAVANTAGE_API_KEY
      supports_market_cap: false
    - id: stooq            # free CSV nominally, but key-gated for this IP (iter-3 lesson) — honest
      label: "Stooq"
      needs_key: true
      env_var: STOOQ_API_KEY
      supports_market_cap: false
  default_source: yahoo     # the import source used when a job omits `source` (no-key ⇒ J-17 fetch never
                            # fails the key gate). MUST be a real catalog id (validated at boot).
  # ops-hardening iter-1 (J-03): no job date-range span cap (removed — was max_range_days: 370). An
  # explicit request of any span is accepted; import_chunking.date_window_days below (chunked execution)
  # is the safety mechanism for an unbounded span.
  gap_preview: 60           # how many backfill-gap dates the coverage payload previews (display cap)
  run_history_limit: 50     # how many recent fetch/backfill runs GET /api/data returns (display cap)
  # J-34 chunked-import tunables: every chunk/backoff/sleep number the resilient FETCH loop reads lives
  # here (anti-goal: No magic numbers — NO chunk/backoff/sleep literal in data_manager.py or the
  # providers). Boot-validated all-positive (sleep MAY be 0); cap >= base. A large import runs in
  # visible chunks; on a persistent 429 it retries with backoff then stops gracefully `resumable`.
  import_chunking:
    symbol_batch_size: 25            # symbols fetched per chunk (a symbol-batch dimension of the plan)
    date_window_days: 90             # max calendar days per date-window chunk (the other plan dimension)
    max_retries: 4                   # 429 retry attempts (after the first try) before pausing resumable
    backoff_base_seconds: 1.0        # exponential backoff base: sleep = min(base * 2**attempt, cap)
    backoff_cap_seconds: 30.0        # backoff ceiling (so a long retry never blocks the worker forever)
    inter_request_sleep_seconds: 0.0 # polite delay between per-symbol requests (0 = none; tunable up)
    fetch_workers: 4                 # J-46: bounded parallel fetch pool size (>= 1; 1 = serial). Per-chunk
                                     # the symbol batch fetches on this many worker threads (network I/O
                                     # only — DB writes stay serialized on the orchestrating thread).
    backfill_workers: 4              # J-53: bounded parallel BACKFILL pool size (>= 1; 1 = serial). The
                                     # multi-date snapshot backfill fans the per-date COMPUTE out to this
                                     # many worker threads (each on its OWN read-only session — pure
                                     # compute, no DB write), while the orchestrating thread owns every
                                     # snapshot/forward-return WRITE serially (so SQLite writes stay
                                     # serialized/transactional and snapshots stay create-once/identical).
  # J-66 fine-grained, honest job-progress knobs: every polling / heartbeat / granularity number the
  # live job card + progress instrumentation reads lives here (anti-goal: No magic numbers — NO poll/
  # heartbeat literal in the frontend job card or data_manager.py). Boot-validated all-positive.
  job_progress:
    poll_interval_seconds: 1.0       # how often the /data live job card re-polls the job status endpoint
    heartbeat_stale_seconds: 20.0    # "updated Ns ago" beyond this → the UI flags the job as possibly
                                     # stalled (a slow-but-alive job still ticks its heartbeat under this)
    per_symbol_ticks: true           # J-66: tick the fetch symbols counter at per-SYMBOL completion
                                     # granularity (true) — the workers update a thread-safe completion
                                     # counter as each symbol finishes; false falls back to per-chunk.

# ----------------------------------------------------------------------------------------
# Datastore. Engine URL from config so SQLite -> Postgres is a config-only switch.
# A RELATIVE sqlite path is resolved against the repository root by app/db.py, so it
# is correct regardless of the process working directory.
database:
  url: "sqlite:///runs/goal-ops-hardening-iter-37/mem-drill/drill.db"
  # iter-24 fast-platform item B — sqlite-only connect-event PRAGMAs (app.db.make_engine). WAL lets
  # readers proceed while a writer holds a transaction (the default DELETE journal blocks them); NORMAL
  # sync skips an fsync between WAL commits (WAL+NORMAL is SQLite's own documented safe pairing for a
  # single-host app — worst case: the last commit is lost on a power cut, never on an ordinary process
  # crash). busy_timeout avoids an immediate "database is locked"; cache_size/mmap_size_bytes/temp_store
  # size the page cache / read mmap window / temp-spill location. Applied ONLY for a sqlite database.url.
  pragmas:
    journal_mode: "WAL"
    synchronous: "NORMAL"
    busy_timeout_ms: 30000
    cache_size: -262144          # negative = KiB -> 256 MB page cache
    mmap_size_bytes: 0           # mmap DISABLED (iter-24 audit). A non-zero mmap_size reserves that many
                                 # bytes of VIRTUAL address space PER pooled connection; at 1 GB x the
                                 # pool (pool_size 10 + max_overflow 20) just ~6 connections exhausted the
                                 # server.memory_cap_mb=6144 `ulimit -v` cap BEFORE the cold /api/data bar
                                 # prefill even ran -> MemoryError/PyO3-panic crash on the first /data load
                                 # after a restart (browser-qa UT-16, reproduced 2/2). The 256 MB page cache
                                 # above (demand-resident, not a virtual reservation) keeps reads fast.
    temp_store: "MEMORY"
  # Pool sized to the uvicorn worker/concurrency shape (the server: block further below allows up to
  # server.limit_concurrency=64 simultaneous connections; pool_size + max_overflow comfortably covers
  # that without over-provisioning idle sqlite connections).
  pool_size: 10
  max_overflow: 20

# ----------------------------------------------------------------------------------------
# Stock universe: ~120 liquid US common stocks spanning the example themes. The filter
# rules are recorded here (applied where data allows in later iterations).
universe:
  filters:
    min_market_cap: 2000000000     # $2B
    min_dollar_vol: 50000000       # $50M average daily dollar volume
    min_price: 10                  # $10 minimum share price
    # iter-18 (J-12 hardening) — the per-date RECENCY gate: a candidate whose LAST bar is more than this
    # many calendar days before the resolve date D is excluded (`stale_series`), so a name whose data ends
    # mid-history exits membership cleanly and never feeds a positionally-misaligned relative-strength
    # window (`rs_vs`). ~2 trading weeks: no US-market-wide closure approaches this (9/11 was 7 days).
    max_staleness_days: 10
  symbols:
