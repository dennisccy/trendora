  LMT:  [ITA, XAR]
  RTX:  [ITA, XAR]
  NOC:  [ITA, XAR]
  GD:   [ITA, XAR]
  LHX:  [ITA, XAR]
  HII:  [ITA, XAR]
  LDOS: [ITA, XAR]
  AXON: [ITA, XAR]
  BA:   [ITA, XAR]
  KTOS: [ITA, XAR]
  # --- homebuilders -> XHB / ITB ---
  DHI:  [XHB, ITB]
  LEN:  [XHB, ITB]
  PHM:  [XHB, ITB]
  NVR:  [XHB, ITB]
  TOL:  [XHB, ITB]
  KBH:  [XHB, ITB]
  MTH:  [XHB, ITB]
  TPH:  [XHB, ITB]
  BLDR: [XHB, ITB]
