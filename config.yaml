  ai_data_centre: [NVDA, AMD, AVGO, MRVL, ANET, DELL, SMCI, VRT, MU, MSFT, AMZN, GOOGL, ORCL, META, PLTR, CIEN]
  semiconductors: [NVDA, AMD, AVGO, MRVL, MU, WDC, STX, LRCX, AMAT, KLAC, TXN, ADI, NXPI, "ON", MCHP, QCOM, INTC, TSM, ASML, ARM, TER, ENTG, COHR, MPWR, SWKS, QRVO, GFS]
