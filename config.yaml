# Trendora — single source of ALL tunables (NO magic numbers in calculation code).
# Read ONLY via apps/backend/app/config.py :: load_config(). Adding a scoring literal
# in code instead of here is an anti-goal violation.
#
# iter-1 CONSUMES: provider, database, universe (+filters), etfs, themes, buckets.
# iter-2 ALSO CONSUMES: indicators, sectors, regime (weights + vix_threshold + label_edges).
# The scoring / decision_rules / walk_forward sections below remain SCAFFOLDED (real config,
# not code) but are NOT wired/consumed until iter-3+. All values are illustrative defaults to
# be tuned against the walk-forward evidence; do not treat them as final.

# ----------------------------------------------------------------------------------------
# Data provider (DEFAULT = offline committed seed; "stooq" is reserved for a future
# config-selected live request-path provider — NOT implemented this iteration).
provider: seed            # seed | stooq

# ----------------------------------------------------------------------------------------
# Datastore. Engine URL from config so SQLite -> Postgres is a config-only switch.
# A RELATIVE sqlite path is resolved against the repository root by app/db.py, so it
# is correct regardless of the process working directory.
database:
  url: "sqlite:///apps/backend/data/trendora.db"

